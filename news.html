<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Latest 2026 tournament news from BBC Sport and The Guardian — headlines, updates and analysis." />
  <title>News — PitchIQ</title>
  <link rel="icon" href="assets/icon.png" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body { padding-top: 60px; }

    .news-hero {
      border-bottom: 1px solid var(--border);
      padding: 40px 24px 28px;
      text-align: center;
    }
    .news-hero .section-label {
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--text-dim);
      margin-bottom: 10px;
    }
    .news-hero h1 {
      font-size: clamp(22px, 4vw, 34px);
      color: var(--yellow);
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .news-hero p {
      font-size: 12px;
      color: var(--green);
      opacity: 0.7;
    }

    .source-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      max-width: 860px;
      margin: 0 auto;
    }
    .source-tab {
      flex: 1;
      padding: 14px 10px;
      font-family: var(--font);
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      text-align: center;
    }
    .source-tab.active {
      color: var(--yellow);
      border-bottom-color: var(--yellow);
    }
    .source-tab:hover:not(.active) { color: var(--green); }

    .news-grid {
      max-width: 860px;
      margin: 0 auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .news-card {
      display: block;
      text-decoration: none;
      background: var(--bg-mid);
      border: 1px solid var(--border);
      padding: 14px 16px;
      transition: border-color 0.15s;
    }
    .news-card:hover { border-color: var(--green); }

    .news-card-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .news-source {
      font-size: 8px;
      letter-spacing: 1.5px;
      color: var(--yellow);
      font-weight: bold;
    }
    .news-time {
      font-size: 8px;
      color: var(--text-dim);
      letter-spacing: 0.5px;
    }
    .news-title {
      font-size: 13px;
      color: var(--green-bright);
      line-height: 1.5;
      margin-bottom: 4px;
    }
    .news-snippet {
      font-size: 10px;
      color: var(--text-dim);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .news-arrow {
      font-size: 9px;
      color: var(--text-dim);
      margin-top: 6px;
      letter-spacing: 1px;
    }

    .loading-msg {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
      font-size: 11px;
      letter-spacing: 1px;
    }

    .error-msg {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-dim);
      font-size: 11px;
      border: 1px solid var(--border);
      max-width: 860px;
      margin: 20px auto;
    }

    .refresh-bar {
      max-width: 860px;
      margin: 0 auto;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .refresh-note {
      font-size: 8px;
      color: var(--text-dim);
      letter-spacing: 0.5px;
    }
    .refresh-btn {
      font-family: var(--font);
      font-size: 8px;
      color: var(--yellow);
      background: none;
      border: 1px solid var(--border);
      padding: 4px 10px;
      cursor: pointer;
      letter-spacing: 1px;
    }
    .refresh-btn:hover { border-color: var(--yellow); }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <div class="nav-logo">
        <img src="assets/icon.png" alt="PitchIQ" class="nav-icon" />
        <a href="index.html" style="text-decoration:none"><span class="nav-name">PitchIQ</span></a>
      </div>
      <div class="nav-links">
        <a href="index.html#features">Features</a>
        <a href="news.html" style="color: var(--yellow)">News</a>
        <a href="blog.html">Blog</a>
        <a href="predict.html">Predict</a>
        <a href="index.html#download" class="nav-cta">Download</a>
      </div>
    </div>
  </nav>

  <div class="news-hero">
    <p class="section-label">PITCHIQ LIVE FEED</p>
    <h1>LATEST NEWS</h1>
    <p>Headlines from BBC Sport and The Guardian — updated automatically.</p>
  </div>

  <div class="source-tabs">
    <button class="source-tab active" data-source="all">ALL</button>
    <button class="source-tab" data-source="bbc">BBC SPORT</button>
    <button class="source-tab" data-source="guardian">THE GUARDIAN</button>
  </div>

  <div class="refresh-bar">
    <span class="refresh-note" id="last-updated">LOADING...</span>
    <button class="refresh-btn" onclick="loadAll()">↻ REFRESH</button>
  </div>

  <div id="news-grid" class="news-grid">
    <div class="loading-msg">◈ FETCHING LATEST HEADLINES...</div>
  </div>

  <script>
    const RSS2JSON = 'https://api.rss2json.com/v1/api.json';

    const FEEDS = {
      bbc:      { url: 'https://feeds.bbci.co.uk/sport/football/rss.xml',       label: 'BBC SPORT',    key: 'bbc' },
      guardian: { url: 'https://www.theguardian.com/football/world-cup-2026/rss', label: 'THE GUARDIAN', key: 'guardian' },
    };

    // Keywords to filter for tournament relevance
    const TOURNAMENT_KEYWORDS = [
      'world cup', '2026', 'knockout', 'group stage', 'round of',
      'quarter', 'semi-final', 'final', 'tournament', 'fixture',
      'canada', 'usa', 'mexico', 'france', 'brazil', 'england',
      'argentina', 'portugal', 'spain', 'morocco', 'norway', 'sweden',
      'germany', 'paraguay', 'ecuador', 'belgium', 'colombia',
    ];

    function isRelevant(item) {
      const text = `${item.title} ${item.description}`.toLowerCase();
      return TOURNAMENT_KEYWORDS.some(kw => text.includes(kw));
    }

    function timeAgo(dateStr) {
      const diff = (Date.now() - new Date(dateStr)) / 1000;
      if (diff < 3600)  return `${Math.floor(diff / 60)}m ago`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
      return `${Math.floor(diff / 86400)}d ago`;
    }

    function stripHtml(str) {
      return (str || '').replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').trim();
    }

    async function fetchFeed(feed) {
      try {
        const res = await fetch(`${RSS2JSON}?rss_url=${encodeURIComponent(feed.url)}&count=30`);
        const data = await res.json();
        if (data.status !== 'ok') return [];
        return data.items
          .filter(isRelevant)
          .map(item => ({
            title:     item.title,
            snippet:   stripHtml(item.description).slice(0, 160),
            link:      item.link,
            date:      item.pubDate,
            source:    feed.label,
            sourceKey: feed.key,
          }));
      } catch {
        return [];
      }
    }

    let allArticles = [];
    let activeSource = 'all';

    function renderArticles() {
      const grid = document.getElementById('news-grid');
      const filtered = activeSource === 'all'
        ? allArticles
        : allArticles.filter(a => a.sourceKey === activeSource);

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="error-msg">◈ NO HEADLINES FOUND — CHECK BACK SHORTLY</div>';
        return;
      }

      grid.innerHTML = filtered.map(a => `
        <a class="news-card" href="${a.link}" target="_blank" rel="noopener noreferrer">
          <div class="news-card-meta">
            <span class="news-source">${a.source}</span>
            <span class="news-time">${timeAgo(a.date)}</span>
          </div>
          <div class="news-title">${a.title}</div>
          ${a.snippet ? `<div class="news-snippet">${a.snippet}</div>` : ''}
          <div class="news-arrow">READ MORE →</div>
        </a>
      `).join('');
    }

    async function loadAll() {
      document.getElementById('news-grid').innerHTML = '<div class="loading-msg">◈ FETCHING LATEST HEADLINES...</div>';
      document.getElementById('last-updated').textContent = 'LOADING...';

      const [bbc, guardian] = await Promise.all([
        fetchFeed(FEEDS.bbc),
        fetchFeed(FEEDS.guardian),
      ]);

      allArticles = [...bbc, ...guardian].sort((a, b) => new Date(b.date) - new Date(a.date));

      const now = new Date();
      document.getElementById('last-updated').textContent =
        `UPDATED ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

      renderArticles();
    }

    // Source tabs
    document.querySelectorAll('.source-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.source-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeSource = tab.dataset.source;
        renderArticles();
      });
    });

    loadAll();
  </script>

</body>
</html>
